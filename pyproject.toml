[tool.poetry]
name = "llama_cpp_debugger"
version = "0.2.0"
description = "llama.cpp.debugger - llama.cpp + MCP-driven Linux/systemd/gdb agent for embedded Linux SUTs"
authors = ["AI Summit <leonardo_salvatore@trimble.com>"]
readme = "README.md"
packages = [{ include = "systemd_mcp" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastmcp = "<3"
paramiko = "*"
openai = "*"
prompt-toolkit = "^3.0"
# vectordb subpackage: numpy for vector math, sqlite-vec for the on-disk
# ANN store (single-file SQLite extension, no daemon). httpx is pulled
# transitively by openai so we don't declare it here.
numpy = "*"
sqlite-vec = "*"
# perf_* profiling tools: matplotlib renders the function-overhead treemap
# heatmap (systemd_mcp/perf_heatmap.py) on the host from perf.data pulled
# off the SUT. Agg backend, so it works headless. perf_heatmap soft-fails
# with an actionable error if this is missing.
matplotlib = "*"
# vectordb_ui subpackage: Toga is BeeWare's native-widget GUI toolkit.
# On Linux it renders through GTK, so toga-gtk (which pulls PyGObject)
# is the backend. Pure Python + native bindings - installs cleanly on
# 3.12, unlike the LVGL CPython binding it replaces. Optional at runtime:
# the rest of the project (server, chat CLI, vectordb CLI) never imports
# toga, so a headless box can skip these without breaking anything.
toga = "*"
toga-gtk = "*"

[tool.poetry.scripts]
systemd_mcp_server = "systemd_mcp.server:main"
llama_debugger_mcp_cli = "systemd_mcp.cli:main"
llama_debugger_vectordb = "systemd_mcp.vectordb.cli:main"
llama_debugger_vectordb_ui = "systemd_mcp.vectordb_ui.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
